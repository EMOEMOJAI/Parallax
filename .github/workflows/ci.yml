name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs use disposable GitHub-hosted runners, including pull requests.
jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [backend, agent]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check known Go vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=production --project=source-auth
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Reject unsafe HTML rendering
        run: |
          if grep -r 'dangerouslySetInnerHTML' src; then
            exit 1
          fi

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e -- --project=visual
      - name: Save visual differences
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-differences
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  deployment:
    name: Deployment scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax and lint
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/*.sh
      - run: python3 -m unittest discover -s deploy/tests
      - run: docker compose config --quiet

  quality:
    name: Workflow and privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check Python integration dependency vulnerabilities
        run: |
          python3 -m pip install pip-audit==2.10.1
          python3 -m pip_audit --strict --require-hashes -r tests/integration/requirements.txt
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/check-privacy.py
      - run: python3 scripts/check-commit-privacy.py
      - run: shellcheck .githooks/pre-push
      - name: Scan history for secrets without exposing matches
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --log-opts=HEAD --redact --no-banner .

  integration:
    name: Container integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production images
        run: |
          docker build --file Dockerfile.server --tag parallax-server:ci .
          docker build --build-arg "AGENT_VERSION=$GITHUB_SHA" --file Dockerfile.agent --tag parallax-agent:ci .
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Generate image software bills of materials
        run: |
          mkdir -p test-results/images
          for component in server agent; do
            trivy image --scanners vuln --format cyclonedx --output "test-results/images/$component.cdx.json" "parallax-$component:ci"
          done
      - name: Reject high and critical image vulnerabilities
        run: |
          result=0
          for component in server agent; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "test-results/images/$component.vulnerabilities.json" "parallax-$component:ci" || result=1
          done
          exit "$result"
      - name: Save image inventories and vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-security-reports
          path: test-results/images/
          retention-days: 14
      - run: python3 -m pip install --require-hashes -r tests/integration/requirements.txt
      - name: Verify UI, metrics access, nonroot agents and shell protocol
        run: python3 tests/integration/containers.py
      - name: Save integration failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-failures
          path: test-results/integration/
          retention-days: 7

  packages:
    name: Release packages
    uses: ./.github/workflows/packages.yml
