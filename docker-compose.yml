services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - CLIENT_API_KEY=${CLIENT_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      - schedules:/app/data
    restart: unless-stopped

  # Example agent node - deploy one per location
  agent-hk:
    build:
      context: .
      dockerfile: Dockerfile.agent
    cap_add:
      - NET_RAW
    command: >
      -server ws://server:8080/ws/agent
        -name "HK-Node-1"
        -location "Hong Kong, CN"
        -flag "🇭🇰"
        -ipv4 "203.0.113.10"
        -provider "Example DC"
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY:-}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  schedules:
